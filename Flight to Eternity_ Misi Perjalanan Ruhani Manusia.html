let AC;function snd(f,d,t="square",v=.04){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

<input id=nm placeholder="Nama Lengkap" value="${esc(P.name)}"><input id=ni placeholder="NIM" value="${esc(P.nim)}">
<select id=pr><option${P.prodi=="D3 Keperawatan"?" selected":""}>D3 Keperawatan</option><option${P.prodi=="S1 MIKES"?" selected":""}>S1 MIKES</option></select>
<button onclick="go(0,0)">▶ Mulai Baru</button>${ck?`<button onclick="go(${ck.l},1)">⏩ Lanjutkan dari Level ${ck.l+1}</button>`:""}
<p class=s>High Score: ${sg("fte_hs")||0} · Panah/WASD = gerak, Spasi/X = tembak, P = jeda. Berjalan offline.</p>`)}
function go(l,c){const n=$("nm").value.trim(),i=$("ni").value.trim();if(!n||!i){alert("Isi Nama Lengkap dan NIM dahulu.");return}
P={name:n,nim:i,prodi:$("pr").value};ss("fte_p",JSON.stringify(P));
if(c){const k=JSON.parse(sg("fte_ck"));score=k.s;acc={c:k.c,t:k.t}}else{score=0;acc={c:0,t:0}}intro(l)}
function intro(l){ss("fte_ck",JSON.stringify({l,s:score,c:acc.c,t:acc.t}));st="intro";
ov(`<h2>Level ${l+1}: ${LV[l].n}</h2><div class=cd>${LV[l].nar}</div><p class=s>Sentuh 4 Beacon Ilmu (📜 emas) dan jawab soalnya. Ambil item: ★ skor, S perisai 8 dtk, + nyawa, 2x peluru ganda.</p><button onclick="startLevel(${l})">🚀 Terbang</button>`)}
function startLevel(l){G={l,t:0,p:{x:90,y:200,vy:0,hp:5,max:5,inv:0,sh:0,db:0,cd:0},b:[],e:[],i:[],f:[],eb:[],pt:[],sp:1,bl:0,bd:0,boss:null,s0:score,c0:acc.c,t0:acc.t};st="play";hov()}
function restartLv(){score=G.s0;acc.c=G.c0;acc.t=G.t0;startLevel(G.l)}
function pause(){if(st!="play")return;st="pause";ov(`<h2>⏸ Jeda</h2><button onclick="hov();st='play'">▶ Lanjut</button><button onclick="restartLv()">↻ Ulangi Level</button><button onclick="tm()">🔊/🔇 Suara</button><button onclick="menu()">🏠 Menu Utama</button>`)}
function over(){st="over";snd(100,.6,"sawtooth");ov(`<h2>Pesawat Jatuh</h2><p>Energi ruhani habis. Jangan menyerah, perbaiki niat dan terbang lagi!</p><button onclick="restartLv()">↻ Ulangi Level ${G.l+1}</button>`)}
function hurt(){const p=G.p;if(p.sh>0||p.inv>0)return;p.hp--;p.inv=1.5;snd(120,.3,"sawtooth");if(p.hp<=0)over()}
// Quiz
function quiz(q,cb,boss){const o=[q[2],q[3],q[4],q[5]].map((t,i)=>({t,ok:i==0}));
for(let i=3;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}
let first=true,done=false;
ov((q[0]?`<div class=cd>📖 ${q[0]}</div>`:"<div class=cd>⚔ Soal Kasus Pertarungan Bos</div>")+`<h3>${q[1]}</h3>`+o.map((x,i)=>`<button class=op data-i=${i}>${"ABCD"[i]}. ${x.t}</button>`).join("")+`<div id=fbk></div>`);
const bs=[...document.querySelectorAll(".op")];
function show(ok){$("fbk").innerHTML=`<p class="${ok?"ok":"no"}">${ok?"✔ Benar! ":boss?"✘ Salah (−1 HP pesawat). ":"✘ Salah, coba lagi. "}${q[6]}</p>`+(done?`<button id=nx>Lanjut ▶</button>`:"");if(done)$("nx").onclick=()=>{hov();cb()}}
bs.forEach(b=>b.onclick=()=>{if(done)return;const x=o[b.dataset.i];if(first){first=false;acc.t++;if(x.ok)acc.c++}
if(x.ok){done=true;b.classList.add("ok");snd(660,.2,"sine");bs.forEach(y=>y.disabled=true);show(true)}
else{b.classList.add("no");b.disabled=true;snd(160,.25,"sawtooth");if(boss){done=true;G.p.hp--;bs.forEach((y,i)=>{y.disabled=true;if(o[i].ok)y.classList.add("ok")})}show(false)}})}
function bcb(){const g=G,b=g.boss;b.nx--;if(g.p.hp<=0){over();return}if(b.nx<0){score+=500;fin()}else st="play"}

// Update

p.cd-=dt;p.inv-=dt;p.sh-=dt;p.db-=dt;
if((K[" "]||K.x||fh)&&p.cd<=0){p.cd=.17;if(p.db>0){g.b.push({x:p.x+24,y:p.y-8},{x:p.x+24,y:p.y+8})}else g.b.push({x:p.x+24,y:p.y});snd(900,.05)}

g.e.forEach(e=>{e.x+=e.vx*dt;if(e.k==1)e.y=Math.max(25,Math.min(375,e.y0+Math.sin(g.t*3+e.ph)*50));if(e.k==2)e.rot+=dt*2});

g.b.forEach(b=>{for(const e of g.e)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp--;b.x=9999;if(e.hp<=0){kill(e);e.x=-999}break}
if(bo&&Math.abs(b.x-bo.x)<55&&Math.abs(b.y-bo.y)<60){bo.hp-=5;b.x=9999;boom(b.x>W?bo.x-50:b.x,b.y,"#E0FBFC")}});
g.e.forEach(e=>{if(e.x>-100&&Math.hypot(p.x-e.x,p.y-e.y)<e.r+14){e.x=-999;boom(e.x,e.y,"#ff7043");hurt()}});
g.i.forEach(i=>{i.x-=80*dt;if(Math.hypot(p.x-i.x,p.y-i.y)<22){i.x=-999;snd(1200,.15,"sine");if(i.k==0)score+=50;else if(i.k==1)p.sh=8;else if(i.k==2)p.hp=Math.min(p.max,p.hp+1);else p.db=10}});
g.i=g.i.filter(i=>i.x>-30);
if(!bo){if(!g.f.length&&g.bd<4){g.bl+=dt;if(g.bl>5){g.f.push({x:W+30,y:60+Math.random()*280});g.bl=0}}
g.f.forEach(f=>{f.x-=70*dt;if(Math.hypot(p.x-f.x,p.y-f.y)<28){g.f=[];st="quiz";snd(880,.2,"sine");quiz(QB[l][g.bd],()=>{g.bd++;score+=100;g.bl=0;if(g.bd>=4){l<4?win():mini()}else st="play"})}else if(f.x<-30){g.f=[];g.bl=3.5}})}
if(bo){bo.x+=(620-bo.x)*Math.min(1,dt*2);bo.y=200+Math.sin(g.t*.9)*110;bo.f-=dt;const ph=bo.hp>400?1:bo.hp>200?2:3;
if(bo.f<=0){bo.f=ph==1?1.1:ph==2?1.3:1.6;const a=Math.atan2(p.y-bo.y,p.x-bo.x),sh=n=>g.eb.push({x:bo.x-40,y:bo.y,vx:Math.cos(n)*230,vy:Math.sin(n)*230});
if(ph==1)sh(a);else if(ph==2){sh(a-.3);sh(a);sh(a+.3)}else{for(let i=0;i<8;i++)sh(i*Math.PI/4+g.t);sh(a)}snd(120,.2,"sawtooth")}
g.eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(p.x-b.x,p.y-b.y)<18){b.x=-999;hurt()}});g.eb=g.eb.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
if(st=="play"&&bo.hp<=bo.nx*100){bo.hp=bo.nx*100;st="quiz";quiz(BQ[5-bo.nx],bcb,true)}}
g.pt.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt});g.pt=g.pt.filter(q=>q.l>0)}
// Draw
const SR=Array.from({length:90},()=>[Math.random()*W,Math.random()*H,20+Math.random()*120,.3+Math.random()*.7]);
function poly(a,f,s){X.beginPath();a.forEach((q,i)=>X[i?"lineTo":"moveTo"](q[0],q[1]));X.closePath();if(f){X.fillStyle=f;X.fill()}if(s){X.strokeStyle=s;X.stroke()}}
function bg(){const L=LV[G?G.l:0],t=G?G.t:0;let g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,L.b[0]);g.addColorStop(1,L.b[1]);X.fillStyle=g;X.fillRect(0,0,W,H);
L.nb.forEach((c,i)=>{const x=((i*400+300-t*8*(i+1))%1000+1000)%1000-100,y=100+i*180,r=X.createRadialGradient(x,y,0,x,y,220);r.addColorStop(0,c);r.addColorStop(1,"rgba(0,0,0,0)");X.fillStyle=r;X.fillRect(0,0,W,H)});
X.fillStyle=L.sc;SR.forEach(s=>{const x=((s[0]-t*s[2])%W+W)%W;X.globalAlpha=s[3];X.fillRect(x,s[1],s[2]/50+1,s[2]/50+1)});X.globalAlpha=1;
if(G&&G.l==4){X.fillStyle="#FFD70055";X.fillRect(0,H-32,W,3);const r=X.createLinearGradient(0,H-30,0,H);r.addColorStop(0,"#000");r.addColorStop(1,"#3a0a0a");X.fillStyle=r;X.fillRect(0,H-30,W,30)}}
function draw(){bg();if(!G)return;const g=G,p=g.p;X.font="11px system-ui";X.textAlign="center";
g.i.forEach(i=>{X.fillStyle=["#FFD700","#E0FBFC","#4caf50","#00e5ff"][i.k];X.beginPath();X.arc(i.x,i.y,11,0,7);X.fill();X.fillStyle="#0B132B";X.fillText(["★","S","+","2x"][i.k],i.x,i.y+4)});
g.f.forEach(f=>{const s=1+Math.sin(g.t*5)*.15;poly([[f.x,f.y-24*s],[f.x+20*s,f.y],[f.x,f.y+24*s],[f.x-20*s,f.y]],"#FFD70033","#FFD700");X.fillStyle="#FFD700";X.fillText("📜 Beacon Ilmu",f.x,f.y+38)});
g.e.forEach(e=>{if(e.k==0){X.fillStyle="#ff704355";poly([[e.x,e.y-8],[e.x+60,e.y],[e.x,e.y+8]],"#ff704355");X.fillStyle="#ff7043";X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill()}
else if(e.k==1){poly([[e.x-15,e.y],[e.x,e.y-15],[e.x+15,e.y],[e.x,e.y+15]],"#7b1fa2","#e040fb");X.fillStyle="#f44";X.fillRect(e.x-6,e.y-2,12,4)}
else{poly(Array.from({length:8},(_,i)=>{const a=e.rot+i*.785,r=e.r*(i%2?.8:1.05);return[e.x+Math.cos(a)*r,e.y+Math.sin(a)*r]}),"#6d5c4a","#b89b72")}});
const b=g.boss;if(b){poly([[b.x-60,b.y],[b.x-20,b.y-50],[b.x+50,b.y-35],[b.x+60,b.y],[b.x+50,b.y+35],[b.x-20,b.y+50]],"#05050a","#6a1b9a");
poly([[b.x-30,b.y-48],[b.x-22,b.y-72],[b.x-8,b.y-54],[b.x,b.y-78],[b.x+10,b.y-52],[b.x+24,b.y-70],[b.x+30,b.y-44]],"#b8860b","#FFD700");X.fillStyle="#f22";X.fillRect(b.x-34,b.y-8,14,6);X.fillRect(b.x-34,b.y+8,14,6);
X.fillStyle="#222";X.fillRect(200,28,400,10);X.fillStyle="#d32f2f";X.fillRect(200,28,400*Math.max(0,b.hp)/600,10);X.fillStyle="#FFD700";X.fillText("Si Ignoransi · Fase "+(b.hp>400?1:b.hp>200?2:3),400,22)}
X.fillStyle="#d500f9";g.eb.forEach(e=>{X.beginPath();X.arc(e.x,e.y,6,0,7);X.fill()});
X.shadowColor="#FFD700";X.shadowBlur=8;X.fillStyle="#E0FBFC";g.b.forEach(q=>X.fillRect(q.x-9,q.y-2,18,4));X.shadowBlur=0;
if(g.p.hp>0){X.save();X.translate(p.x,p.y);X.rotate(p.vy*.25);if(p.inv>0&&Math.floor(p.inv*15)%2)X.globalAlpha=.4;
const fl=14+Math.random()*10,fg=X.createLinearGradient(-18,0,-18-fl,0);fg.addColorStop(0,"#FFD700");fg.addColorStop(1,"rgba(0,255,200,0)");poly([[-16,-6],[-18-fl,0],[-16,6]],fg);
poly([[26,0],[4,-8],[-8,-22],[-16,-22],[-12,-6],[-18,-6],[-18,6],[-12,6],[-16,22],[-8,22],[4,8]],"#cfd8dc","#FFD700");X.fillStyle="#006A4E";X.beginPath();X.ellipse(6,0,8,4,0,0,7);X.fill();
if(p.sh>0){X.strokeStyle="#E0FBFC";X.globalAlpha=.7;X.beginPath();X.arc(0,0,32,0,7);X.stroke()}X.restore();X.globalAlpha=1;
X.fillStyle="#E0FBFC";X.font="10px system-ui";X.fillText(P.name+" · "+P.nim,p.x,p.y-34)}
g.pt.forEach(q=>{X.globalAlpha=Math.max(0,q.l*2);X.fillStyle=q.c;X.fillRect(q.x,q.y,3,3)});X.globalAlpha=1;
X.textAlign="left";X.font="bold 13px system-ui";X.fillStyle="#FFD700";X.fillText("Lv"+(g.l+1)+" "+LV[g.l].n,10,18);X.fillStyle="#E0FBFC";X.fillText("Skor "+score,10,36);X.fillStyle="#ff5252";X.fillText("♥".repeat(Math.max(0,p.hp)),10,54);
X.fillStyle="#FFD700";X.fillText("📜 "+g.bd+"/4"+(p.sh>0?"  🛡"+Math.ceil(p.sh):"")+(p.db>0?"  2x"+Math.ceil(p.db):""),10,72)}
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(st=="play")upd(dt);draw()}
